<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>strudel-sessions</title>
<style>
  :root { --bg:#0b0d0b; --fg:#c9d1c8; --dim:#5f6b5e; --acc:#7ee787; --err:#ff7b72; }
  * { box-sizing: border-box; }
  /* colour lives on html only: a body background would paint over the z-index -1 canvas */
  html { height: 100%; background: var(--bg); }
  body { height: 100%; margin: 0; background: transparent; color: var(--fg);
    font: 14px/1.45 ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; }
  body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
  header { padding: 8px 12px; border-bottom: 1px solid #1c221b; color: var(--dim); display: flex; gap: 16px; align-items: baseline; }
  header b { color: var(--acc); font-weight: 600; }
  header .state { margin-left: auto; }
  header .state.on { color: var(--acc); }
  #tracks { padding: 6px 12px; border-bottom: 1px solid #1c221b; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  #tracks a { color: var(--fg); text-decoration: none; cursor: pointer; }
  #tracks a:hover, #tracks a.active { color: var(--acc); }
  #tracks a i { color: var(--dim); font-style: normal; margin-right: 4px; }
  #editor { min-height: 0; overflow: hidden; }
  #editor .cm-editor { height: 100%; }
  #editor .cm-scroller { overflow: auto; }
  footer { border-top: 1px solid #1c221b; padding: 6px 12px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
  #log { color: var(--dim); white-space: pre-wrap; max-height: 4.4em; overflow: hidden; }
  #log .err { color: var(--err); }
  #log .ok { color: var(--acc); }
  #keys { color: var(--dim); text-align: right; }
  #keys button { background: none; border: 1px solid #2a332a; color: var(--fg); font: inherit; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
  #keys button:hover { border-color: var(--acc); color: var(--acc); }
  #test-canvas { z-index: -1; opacity: .85; }
</style>
  <script type="module" crossorigin src="./assets/index-BEQfazkK.js"></script>
</head>
<body>
  <header><b>strudel-sessions</b> <span>ctrl+enter play &middot; ctrl+. stop &middot; ctrl+&uarr;/&darr; tracks &middot; ctrl+shift+v visuals</span> <span class="state" id="state">stopped</span></header>
  <nav id="tracks"></nav>
  <div id="editor"></div>
  <footer>
    <div id="log">loading engine...</div>
    <div id="keys"><button id="play">play</button><button id="stop">stop</button></div>
  </footer>
</body>
</html>
